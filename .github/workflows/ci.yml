name: CI

# Runs on GitHub-hosted runners because the development machine has 8 GB RAM.
# Install/build/test/browser inspection work stays in CI, not on the local machine.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, test, build, responsive viewport inspection
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Public, non-secret. Never put a private key in a NEXT_PUBLIC_ variable.
          NEXT_PUBLIC_SOLANA_CLUSTER: devnet

      - name: Install Playwright for viewport inspection (CI-only)
        run: npm install --no-save --no-package-lock playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production server
        run: |
          npm run start > /tmp/usagebar-next.log 2>&1 &
          echo $! > /tmp/usagebar-next.pid
        env:
          PORT: "3000"
          NEXT_PUBLIC_SOLANA_CLUSTER: devnet

      - name: Inspect rendered page at required viewport widths
        run: node scripts/check-responsive.mjs
        env:
          USAGEBAR_BASE_URL: http://127.0.0.1:3000
          USAGEBAR_ARTIFACT_DIR: artifacts/viewport-inspection/local

      - name: Inspect Vercel branch preview at required viewport widths
        continue-on-error: true
        run: node scripts/check-responsive.mjs
        env:
          USAGEBAR_BASE_URL: https://usagebar-git-fix-ui-branding-acce-07fa11-temmygabriels-projects.vercel.app
          USAGEBAR_ARTIFACT_DIR: artifacts/viewport-inspection/vercel-preview

      - name: Upload viewport screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usagebar-viewport-inspection
          path: artifacts/viewport-inspection/
          if-no-files-found: warn
          retention-days: 14
