name: Devnet bootstrap

# MANUAL TRIGGER ONLY. This is deliberate and must stay this way.
#
# This job reads a wallet private key from repository secrets. If it also ran on
# `pull_request`, then anyone able to open a pull request could edit this file
# on their branch and exfiltrate the key. GitHub does not pass secrets to fork
# pull requests, but a same-repository branch would still get them, and relying
# on that distinction is a thinner defence than simply not running here.
#
# workflow_dispatch means a human with write access must press the button.
on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you running this?"
        required: false
        default: "bootstrap the devnet test token"

permissions:
  contents: read

concurrency:
  group: devnet-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: create the devnet test token
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Installed with --no-save and --no-package-lock so that package.json and
      # package-lock.json are left exactly as they are. The main CI job runs
      # `npm ci`, which fails if the lockfile and package.json disagree, so
      # touching them here would break the build. These are test tools, not app
      # dependencies, and they are installed fresh on every run.
      - name: Install Solana tooling without touching the lockfile
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund \
            @solana/kit@8.4.0 \
            @solana-program/token@0.17.0 \
            @solana-program/system@0.15.0

      # If the line above ever did modify the manifest, fail loudly here rather
      # than letting the main CI break mysteriously on an unrelated later commit.
      - name: Confirm the lockfile was not modified
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            echo "::error::package.json or package-lock.json was modified by this job."
            git diff -- package.json package-lock.json
            exit 1
          fi
          echo "package.json and package-lock.json are untouched."

      - name: Create the devnet test token
        run: node tools/devnet-bootstrap.mjs
        env:
          DEVNET_PAYER_KEYPAIR: ${{ secrets.DEVNET_PAYER_KEYPAIR }}
          DEVNET_TEST_MINT_KEYPAIR: ${{ secrets.DEVNET_TEST_MINT_KEYPAIR }}
