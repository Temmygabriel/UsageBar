name: CI

# Build spec Section 54.
#
# Runs on GitHub-hosted runners because the development machine has 8 GB RAM
# (build spec Section 1.5). Standard runners are free with no minute cap on
# public repositories, so all install/build/test work happens here and never
# on the local machine.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Public, non-secret. Never put a private key in a NEXT_PUBLIC_ variable.
          NEXT_PUBLIC_SOLANA_CLUSTER: devnet
